name: Daily Analyst Refresh

# Runs every day at 02:00 UTC = 09:00 GMT+7 (WIB).
# Generates the analyst layer with Claude Code on your MAX plan (via the OAuth
# token — NOT the paid API) and publishes it to your Worker. Fully cloud-based:
# no personal machine needs to be on.
on:
  schedule:
    # Kept as a backup, but GitHub's scheduler is unreliable — the Cloudflare
    # Worker triggers this via repository_dispatch (reliable) as the primary path.
    - cron: "0 2 * * *"    # 09:00 GMT+7 (backup)
    - cron: "0 3 * * *"    # 10:00 GMT+7 (backup)
  repository_dispatch:
    types: [refresh-analyst]   # fired by the Cloudflare Worker, once daily
  workflow_dispatch: {}        # lets you run it on-demand from the Actions tab

concurrency:
  group: analyst-refresh
  cancel-in-progress: false

permissions:
  contents: write   # lets the keepalive job push an empty commit

jobs:
  # Keepalive: GitHub disables scheduled workflows after 60 days of NO repo
  # commits. The daily runs don't count as "commits", so without this the
  # schedule silently dies (as it did Sep 7 -> Oct 5). This pushes a tiny empty
  # commit on the 1st of each month, permanently resetting the 60-day clock.
  keepalive:
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit once a month to stay enabled
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to prevent 60-day workflow disable"
            git push
          else
            echo "Not the 1st; skipping keepalive commit."
          fi

  # Fetch US2Y + Fed funds target from FRED here (GitHub's IPs are NOT blocked by
  # FRED, unlike Cloudflare's, which return HTTP 520) and publish to the Worker.
  # Runs independently of the Claude analyst step so rates refresh even if that
  # step fails. Needs secrets: FRED_API_KEY, PUBLISH_TOKEN.
  publish-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER: https://intelligence-terminal.ngaserin.workers.dev
    steps:
      - name: Fetch FRED rates and publish to Worker
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          set -e
          grab () {
            curl -sS "https://api.stlouisfed.org/fred/series/observations?series_id=$1&api_key=${FRED_API_KEY}&file_type=json&sort_order=desc&limit=30" \
              | python3 -c "import sys,json; o=[x for x in json.load(sys.stdin).get('observations',[]) if x['value'] not in ('.','')]; print(o[0]['value'] if o else '')"
          }
          US2Y=$(grab DGS2)
          UPPER=$(grab DFEDTARU)
          LOWER=$(grab DFEDTARL)
          echo "US2Y=$US2Y UPPER=$UPPER LOWER=$LOWER"
          python3 - <<EOF > rates.json
          import json
          def num(s):
              try: return float(s)
              except: return None
          json.dump({"us2y":num("$US2Y"),"fedLower":num("$LOWER"),"fedUpper":num("$UPPER")}, open("rates.json","w"))
          EOF
          cat rates.json
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST "${WORKER}/api/rates" \
            -H "x-publish-token: ${PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @rates.json)
          echo "HTTP $code"; cat resp.json
          test "$code" = "200"

  publish-analyst:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run after rates publish so US2Y + Fed target are already in the snapshot
    # when the analyst fetches /api/data. 'always()' so a rates hiccup never
    # blocks the analyst run.
    needs: publish-rates
    if: always()
    env:
      WORKER: https://intelligence-terminal.ngaserin.workers.dev
    steps:
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate analyst JSON (Claude Code on MAX)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "Fetch ${WORKER}/api/data and read the live prices, tripwire current values, ETF flows (BTC/ETH/HYPE), FRED rates, Fear and Greed, and news headlines in it. Check which fields are actually present before judging data quality: the payload has prices{} (incl US2Y, US10Y, US30Y, BTC/ETH/SOL/XRP/HYPE), flows{BTC,ETH,HYPE arrays}, fed{target}, fng, and news[]. NEVER state a data source is missing, empty, or unavailable unless that field is literally null or an empty array in the JSON you fetched — if flows, crypto prices, fed target and US2Y are present, treat them as available and base conviction on signal agreement, not on a false claim of missing data. Acting as a senior cross-asset analyst — probabilistic, risk-first, falsifiable, separating fact from interpretation and grounding every judgment in the live numbers you just fetched — write ONLY a JSON object (no prose, no markdown fences) to a file named analyst.json in the current directory, with EXACTLY these keys: {\"regime\":{\"label\":string,\"conviction\":\"LOW|MEDIUM|HIGH\",\"horizon\":string,\"thesis\":\"2-3 sentences\"},\"tripwires\":[{\"name\":string,\"level\":number_or_null,\"bind\":\"WTI|US10Y|US30Y|BTC|ETH|USDJPY\",\"dir\":\"above|below|above-good|event\",\"note\":string}],\"checklist\":[{\"name\":string,\"status\":\"on|partial|warn|off\",\"detail\":string}],\"calendar\":[{\"d\":\"YYYY-MM-DD\",\"ev\":string,\"imp\":\"low|med|high|critical\",\"note\":string}],\"scenarios\":[{\"name\":\"BASE — ...\" or \"BEAR — ...\" or \"BULL — ...\",\"p\":number,\"txt\":string}]}. Include 6-8 tripwires, 6-8 checklist items, 6-9 calendar events over the next ~3 weeks, and exactly 3 scenarios whose probabilities sum to 100." \
            --allowedTools "WebFetch" "Write" "Bash" \
            --dangerously-skip-permissions

      - name: Validate & strip any fences
        run: |
          python3 - <<'EOF'
          import json
          s = open("analyst.json").read().replace("```json","").replace("```","")
          a, b = s.find("{"), s.rfind("}")
          obj = json.loads(s[a:b+1])
          for k in ("regime","tripwires","checklist","calendar","scenarios"):
              assert k in obj, f"missing key: {k}"
          json.dump(obj, open("analyst.json","w"))
          print("OK — keys:", list(obj.keys()),
                "| scenarios sum:", sum(x.get("p",0) for x in obj["scenarios"]))
          EOF

      - name: Publish to Worker
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          code=$(curl -sS -o resp.json -w "%{http_code}" -X POST "${WORKER}/api/publish" \
            -H "x-publish-token: ${PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @analyst.json)
          echo "HTTP $code"; cat resp.json
          test "$code" = "200"
